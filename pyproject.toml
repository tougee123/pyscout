[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscout"
version = "0.1.0"
description = "Hybrid security auditor for small Python projects: AST rules + optional LLM explanations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
explain = ["anthropic>=1.0.0"]
dev = ["pytest>=7.0"]

[project.scripts]
pyscout = "pyscout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyscout*"]
